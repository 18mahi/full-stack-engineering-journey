<!DOCTYPE html>
<html lang="en">

        <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Evergreen | Login</title>
                <link rel="stylesheet" href="style.css">
        </head>

        <body>

                <main class="login-page">
                        <!-- LEFT SIDE -->
                        <section class="welcome-section">

                                <!-- Brand -->
                                <header class="brand">
                                        <span class="brand-icon">🍃</span>
                                        <span class="brand-name">Evergreen</span>
                                </header>

                                <!-- Welcome Content -->
                                <div class="welcome-content">

                                        <h1>
                                        Focus<br>
                                        on what<br>
                                        matters.
                                        </h1>

                                        <p>
                                        A clean and calm space to sign in
                                        and get things done.
                                        </p>

                                        <span class="small-line"></span>

                                </div>

                                <!-- Plant -->
                                <div class="plant-container">
                                        <div class="plant">🌿</div>
                                        <div class="plant-pot"></div>
                                </div>

                        </section>

                        <!-- RIGHT SIDE -->
                        <section class="login-section">

                                <div class="login-container">

                                        <!-- Top Sign Up -->
                                        <div class="signup-link">
                                                <p>
                                                        Don't have an account?
                                                        <a href="signup.html">Sign up</a>
                                                </p>
                                        </div>


                                        <!-- Login Header -->
                                        <header class="login-header">

                                                <h2>Welcome Back</h2>
                                                <p>Sign in to your account</p>

                                        </header>


                                        <!-- Login Form -->
                                        <form class="login-form" action="#" method="post">

                                                <!-- Email -->
                                                <div class="form-group">

                                                        <label for="email">
                                                        Email address
                                                        </label>

                                                        <div class="input-wrapper">

                                                                <span class="input-icon">✉</span>

                                                                <input
                                                                        type="email"
                                                                        id="email"
                                                                        name="email"
                                                                        placeholder="Email address"
                                                                        autocomplete="email"
                                                                        required
                                                                >

                                                        </div>

                                                </div>


                                                <!-- Password -->
                                                <div class="form-group">

                                                        <label for="password">
                                                        Password
                                                        </label>

                                                        <div class="input-wrapper">

                                                                <span class="input-icon">🔒</span>

                                                                <input
                                                                        type="password"
                                                                        id="password"
                                                                        name="password"
                                                                        placeholder="Password"
                                                                        autocomplete="current-password"
                                                                        required
                                                                >

                                                                <button
                                                                        type="button"
                                                                        class="password-toggle"
                                                                        aria-label="Show password"
                                                                >
                                                                        👁
                                                                </button>

                                                        </div>

                                                </div>


                                                <!-- Remember + Forgot -->
                                                <div class="form-options">

                                                        <label class="remember-me">

                                                                <input
                                                                        type="checkbox"
                                                                        name="remember"
                                                                >

                                                                <span>Remember me</span>

                                                        </label>

                                                        <a href="forgot-password.html">Forgot password?</a>

                                                </div>


                                                <!-- Login Button -->
                                                <button
                                                        type="submit"
                                                        class="login-button"
                                                >
                                                        Sign In
                                                </button>
                                        </form>


                                        <!-- Divider -->
                                        <div class="divider">

                                                <span></span>

                                                <p>or continue with</p>

                                                <span></span>

                                        </div>


                                        <!-- Social Login -->
                                        <div class="social-login">

                                                <button
                                                        type="button"
                                                        class="social-button google-button"
                                                >
                                                        <span>🌈</span>
                                                        <span>Google</span>
                                                </button>


                                                <button
                                                        type="button"
                                                        class="social-button apple-button"
                                                >
                                                        <span>●</span>
                                                        <span>Apple</span>
                                                </button>
                                                
                                                <button
                                                        type="button"
                                                        class="social-button apple-button"
                                                >
                                                        <span>●</span>
                                                        <span>Apple</span>
                                                </button>

                                        </div>


                                        <!-- Bottom Sign Up -->
                                        <p class="bottom-signup">Don't have an account?<a href="signup.html">Sign up</a></p>

                                </div>

                        </section>
                </main>
        </body>
</html>

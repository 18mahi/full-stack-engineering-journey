<!DOCTYPE html>
<html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Profile Card</title>
        </head>

        <body>

                <main class="profile-card">

                        <!-- Profile Image -->
                        <div class="profile-image">
                        <img
                                src="https://img.freepik.com/premium-photo/passport-photo-portrait-young-man-white-background_1028938-330516.jpg?w=200"
                                alt="Profile picture"
                        >
                        </div>

                        <!-- Profile Information -->
                        <section class="profile-info">

                        <h1 class="profile-name">Alex Johnson</h1>

                        <h3 class="profile-role">
                                Frontend Developer
                        </h3>

                        <p class="profile-bio">
                                <b>Bio:</b> Passionate about creating beautiful and user-friendly
                                web experiences using modern web technologies.
                        </p>

                        </section>

                        <!-- Skills -->
                        <section class="skills">

                        <h2>Skills</h2>

                        <ul class="skill-list">
                                <li>HTML</li>
                                <li>CSS</li>
                                <li>JavaScript</li>
                                <li>Git</li>
                        </ul>

                        </section>

                        <!-- Social Links -->
                        <nav class="social-links" aria-label="Social media links">

                        <a href="#" class="social-link">GitHub</a>

                        <a href="#" class="social-link">LinkedIn</a>

                        <a href="#" class="social-link">Twitter</a>

                        </nav>

                        <!-- Profile Action -->
                        <div class="profile-action">

                        <button type="button" class="follow-button">
                                Follow
                        </button>

                        </div>

                </main>

        </body>
</html>
